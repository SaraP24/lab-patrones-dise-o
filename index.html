<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio de Patrones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: índice fijo a la izquierda · teoría arriba · selector de ejercicios · editor y consola lado a lado */
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #1b1f27; --muted: #5d6575; --line: #dde1e8;
  --accent: #2f5bd3; --accent-ink: #ffffff;
  --crea: #0f8a6a; --comp: #b4610b; --estr: #7445c9; --algo: #b23a6b;
  --ok: #17803d; --bad: #c0362c; --warn: #a96a00;
  --code-bg: #fbfbfd; --code-ink: #24292f; --gutter: #9aa1ad;
  --k: #a626a4; --s: #2a7d2a; --c: #8a919d; --n: #b35c00; --t: #1f63c7; --todo: #c0362c;
  --con-bg: #12151b; --con-ink: #d9dee7;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-code: "JetBrains Mono", Consolas, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111318; --panel: #181b22; --ink: #e5e8ee; --muted: #9aa3b2; --line: #2a2f3a;
    --accent: #7c9cff; --accent-ink: #0d1020;
    --crea: #3fc79c; --comp: #f0a24a; --estr: #ad8cff; --algo: #f07aa8;
    --ok: #4fc779; --bad: #ff7468; --warn: #f0b44a;
    --code-bg: #14171d; --code-ink: #d6dbe4; --gutter: #5b6372;
    --k: #d38cf0; --s: #8fd18b; --c: #6e7685; --n: #f2a65a; --t: #7fb0ff; --todo: #ff8a7a;
    --con-bg: #0b0d11; --con-ink: #d9dee7;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-ui); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
nav { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: -.01em; }
nav .sub { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
.progreso { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 4px; }
.progreso i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.progreso-txt { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
.grupo { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; margin: 16px 6px 6px; }
.grupo.crea { color: var(--crea); } .grupo.comp { color: var(--comp); } .grupo.estr { color: var(--estr); } .grupo.algo { color: var(--algo); } .grupo.extra { color: var(--muted); }
nav button.item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); padding: 6px 8px; border-radius: 6px; font-size: 14px; }
nav button.item:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
nav button.item[aria-current="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); font-weight: 600; }
nav .check { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; font-size: 10px; color: transparent; }
nav .hecho .check { background: var(--ok); border-color: var(--ok); color: #fff; }
nav .parcial .check { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 25%, transparent); }
nav .cuenta { margin-left: auto; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }

main { padding: 24px max(16px, 2.5vw) 40px; min-width: 0; }
.cabecera { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 14px; margin-bottom: 4px; }
.cabecera h2 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; border: 1px solid currentColor; }
.chip.crea { color: var(--crea); } .chip.comp { color: var(--comp); } .chip.estr { color: var(--estr); } .chip.algo { color: var(--algo); }
.intencion { font-size: 17px; max-width: 75ch; margin: 6px 0 16px; }

.teoria { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-bottom: 22px; }
.tarjeta { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.tarjeta h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tarjeta p, .tarjeta ul { margin: 0; }
.tarjeta ul { padding-left: 18px; }
.tarjeta li + li { margin-top: 3px; }
.tarjeta pre { margin: 0; font: 12.5px/1.45 var(--f-code); overflow-x: auto; color: var(--code-ink); }
code { font-family: var(--f-code); font-size: .9em; background: color-mix(in srgb, var(--accent) 8%, transparent); padding: 1px 4px; border-radius: 4px; }

.sel-ej { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.sel-ej .rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-right: 4px; }
.sel-ej button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 14px; }
.sel-ej button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel)); font-weight: 600; }
.sel-ej .ok-mini { color: var(--ok); font-weight: 700; }
.origen { font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; background: color-mix(in srgb, var(--algo) 14%, transparent); color: var(--algo); }

.ejercicio { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.ejercicio h3 { margin: 0 0 6px; font-size: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ejercicio ol { margin: 8px 0 0; padding-left: 20px; max-width: 95ch; }
.ejercicio ol li + li { margin-top: 3px; }
.ejercicio .modo { font-size: 13px; color: var(--muted); margin-top: 8px; }
.pistas { margin-top: 10px; }
.pistas button { border: 1px dashed var(--line); background: none; color: var(--accent); border-radius: 6px; padding: 3px 10px; font-size: 13px; }
.pistas p { margin: 8px 0 0; padding: 8px 12px; border-left: 3px solid var(--warn); background: color-mix(in srgb, var(--warn) 8%, transparent); border-radius: 0 6px 6px 0; font-size: 14px; }

.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 7px 14px; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .55; cursor: wait; }
.atajo { color: var(--muted); font-size: 12px; margin-left: auto; }

.lab { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: stretch; }
.editor { position: relative; height: 560px; border: 1px solid var(--line); border-radius: 10px; background: var(--code-bg); overflow: hidden; display: grid; grid-template-columns: 46px minmax(0, 1fr); }
.gutter { font: 13px/20px var(--f-code); color: var(--gutter); text-align: right; padding: 12px 8px 80px 0; overflow: hidden; white-space: pre; user-select: none; border-right: 1px solid var(--line); }
.zona { position: relative; min-width: 0; }
.zona pre, .zona textarea { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font: 13px/20px var(--f-code); font-variant-ligatures: none; font-kerning: none; letter-spacing: 0; tab-size: 4; white-space: pre; overflow-wrap: normal; word-break: normal; overflow: auto; border: 0; }
/* La capa coloreada no tiene barras de scroll: le damos margen extra abajo y a la derecha
   para que siempre pueda desplazarse tanto como el textarea (que sí las tiene) y no se desalinee */
.zona pre { color: var(--code-ink); pointer-events: none; overflow: hidden; padding-bottom: 80px; padding-right: 80px; }
.zona textarea { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; }
.zona textarea::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); color: transparent; }
.tk-k { color: var(--k); font-weight: 600; } .tk-s { color: var(--s); } .tk-c { color: var(--c); font-style: italic; }
.tk-n { color: var(--n); } .tk-t { color: var(--t); } .tk-a { color: var(--n); } .tk-todo { color: var(--todo); font-weight: 600; font-style: normal; }

.consola { display: flex; flex-direction: column; height: 560px; border-radius: 10px; overflow: hidden; background: var(--con-bg); color: var(--con-ink); border: 1px solid var(--line); min-width: 0; }
.con-cab { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #262b35; font-size: 13px; }
.con-cab b { font-weight: 600; }
.estado { margin-left: auto; font-size: 12px; padding: 2px 9px; border-radius: 99px; background: #262b35; color: #b9c0cc; }
.estado.ok { background: #143d24; color: #7ee2a0; } .estado.bad { background: #47201c; color: #ff9d92; } .estado.warn { background: #46340f; color: #ffd27a; }
.con-tabs { display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid #262b35; }
.con-tabs button { background: none; border: 0; color: #8f98a8; padding: 7px 10px; font-size: 13px; border-bottom: 2px solid transparent; }
.con-tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #7c9cff; }
.con-cuerpo { flex: 1; overflow: auto; padding: 10px 14px; font: 13px/1.55 var(--f-code); white-space: pre; }
.con-cuerpo .err { color: #ff9d92; } .con-cuerpo .dim { color: #7d8697; } .con-cuerpo .okl { color: #7ee2a0; }
.diff-l { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; }
.diff-l.mal { background: rgba(255, 100, 90, .12); }
.veredicto { padding: 10px 14px; border-top: 1px solid #262b35; font-size: 14px; }
.veredicto.ok { background: #143d24; color: #9ff0b9; } .veredicto.bad { background: #3a1c19; color: #ffb3aa; }

/* Pruebas tipo CodeRunner dentro de la consola */
.prueba { border: 1px solid #2a303b; border-radius: 8px; margin-bottom: 10px; white-space: normal; font-family: var(--f-ui); }
.prueba > summary { list-style: none; cursor: pointer; padding: 7px 10px; display: flex; gap: 8px; align-items: center; font-size: 13px; }
.prueba > summary::-webkit-details-marker { display: none; }
.prueba.ok > summary .marca { color: #7ee2a0; } .prueba.mal > summary .marca { color: #ff9d92; } .prueba.pend > summary .marca { color: #7d8697; }
.prueba.mal { border-color: #5a2a26; background: rgba(255, 100, 90, .06); }
.prueba .ms { margin-left: auto; color: #7d8697; font-size: 12px; font-variant-numeric: tabular-nums; }
.prueba .bloques { display: grid; gap: 8px; padding: 0 10px 10px; }
.prueba .bloque b { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #8f98a8; margin-bottom: 2px; font-weight: 600; }
.prueba pre { margin: 0; font: 12.5px/1.5 var(--f-code); white-space: pre; overflow-x: auto; background: #181c24; padding: 6px 8px; border-radius: 6px; color: #d9dee7; }
.prueba pre.esp { color: #9ff0b9; } .prueba pre.obt-mal { color: #ffb3aa; }

.aviso { background: color-mix(in srgb, var(--warn) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 50%, var(--line)); padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; }
.aviso code { background: transparent; font-weight: 600; }

table.comp { border-collapse: collapse; width: 100%; font-size: 14px; background: var(--panel); }
table.comp th, table.comp td { text-align: left; border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; }
table.comp th { background: color-mix(in srgb, var(--accent) 7%, var(--panel)); }
.scroll-x { overflow-x: auto; margin-bottom: 20px; }

/* Test teórico */
.quiz-cab { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; margin: 0 0 16px; }
.marcador { font-size: 15px; font-variant-numeric: tabular-nums; }
.marcador b { font-size: 20px; }
.pregunta { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; max-width: 900px; }
.pregunta h3 { margin: 0 0 10px; font-size: 15.5px; font-weight: 600; display: flex; gap: 10px; }
.pregunta h3 .num { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.pregunta .tema { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.opciones { display: grid; gap: 6px; }
.opciones button { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 8px; padding: 8px 12px; font-size: 14.5px; display: flex; gap: 10px; }
.opciones button:hover:not(:disabled) { border-color: var(--accent); }
.opciones button:disabled { cursor: default; }
.opciones .letra { font-weight: 600; color: var(--muted); }
.opciones button.correcta { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
.opciones button.incorrecta { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.explicacion { margin-top: 10px; font-size: 14px; padding: 8px 12px; border-radius: 6px; background: color-mix(in srgb, var(--accent) 7%, transparent); }

@media (max-width: 1000px) {
  .lab { grid-template-columns: minmax(0, 1fr); }
  .editor { height: 460px; } .consola { height: 420px; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  nav .lista { display: flex; flex-wrap: wrap; gap: 4px; }
  nav .grupo { width: 100%; margin: 8px 4px 2px; }
  nav button.item { width: auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <nav aria-label="Patrones">
    <h1>Laboratorio de Patrones</h1>
    <p class="sub">Patrones y estructuras · Java 21 real</p>
    <div class="progreso"><i id="barra-progreso"></i></div>
    <div class="progreso-txt" id="txt-progreso"></div>
    <div class="lista" id="lista"></div>
  </nav>
  <main id="main"></main>
</div>

<script>
/* tipo "programa": el ejercicio tiene su propio main y se compara toda la salida (esperado.txt).
   tipo "pruebas":  estilo CodeRunner; escribís solo las clases y cada prueba de pruebas.txt
                    se ejecuta por separado en su propia JVM. */
const PATRONES = [
{ id: "builder", nombre: "Builder", cat: "crea",
  intencion: "Construye un objeto complejo paso a paso, separando la construcción de la representación final.",
  problema: "Un constructor con 8 parámetros, la mitad opcionales: new Pizza(\"grande\", null, true, false, null...). Es ilegible y fácil de equivocarse en el orden.",
  analogia: "Pedir un bocadillo en una barra: eliges pan, luego relleno, luego salsas, y al final te lo entregan montado.",
  cuando: ["Objetos con muchos parámetros opcionales", "Quieres objetos inmutables (campos final)", "Quieres validar todo antes de crear el objeto"],
  estructura: "Pizza (producto inmutable)\n └─ Pizza.Builder\n      masa(..)        → return this\n      ingrediente(..) → return this\n      build()         → valida y crea Pizza",
  enJava: ["StringBuilder", "HttpClient.newBuilder()", "Stream.builder()", "Lombok @Builder"],
  ojo: "Cada método del builder devuelve this para poder encadenar. El constructor del producto suele ser privado. Ventaja clave (pregunta de examen): separa el proceso de construcción de la representación del objeto.",
  ejercicios: [
    { id: "builder", titulo: "Pizzería", tipo: "programa",
      tarea: "Completa el Builder de Pizza para que la construcción encadenada funcione y la validación rechace tamaños no válidos.",
      pistas: ["En masa(): this.masa = masa; antes del return this.", "En ingrediente(): ingredientes.add(ingrediente);", "En build(): if (!List.of(\"pequeña\", \"mediana\", \"grande\").contains(tamano)) throw new IllegalArgumentException(...)"] },
    { id: "builder-computadora", titulo: "Computadoras", tipo: "pruebas",
      tarea: "Completa el Builder de Computadora: el procesador es obligatorio y el resto de componentes tiene valores por defecto.",
      pasos: ["Constructor privado de Computadora: copia los cuatro valores desde el builder.", "memoriaRam(), almacenamiento() y tarjetaGrafica(): guarda el valor y devuelve this para poder encadenar.", "build(): si memoriaRam es menor o igual a 0, lanza IllegalArgumentException(\"La memoria RAM debe ser mayor que 0\").", "build(): devuelve new Computadora(this)."],
      pistas: ["this.procesador = builder.procesador; (y lo mismo con los otros tres)", "public Builder memoriaRam(int memoriaRam) { this.memoriaRam = memoriaRam; return this; }", "if (memoriaRam <= 0) throw new IllegalArgumentException(\"La memoria RAM debe ser mayor que 0\"); return new Computadora(this);"] }
  ] },

{ id: "abstract-factory", nombre: "Abstract Factory", cat: "crea",
  intencion: "Proporciona una interfaz para crear familias de objetos relacionados sin especificar sus clases concretas.",
  problema: "Tu app tiene tema claro y oscuro. Si mezclas un botón claro con un checkbox oscuro, la interfaz queda rota. Necesitas garantizar que todos los componentes sean de la misma familia.",
  analogia: "Una tienda de muebles por estilos: si eliges 'nórdico', la silla, la mesa y el sofá vienen todos del mismo catálogo.",
  cuando: ["Hay varias familias de productos que deben usarse juntas", "Quieres cambiar de familia entera cambiando un solo objeto", "El cliente no debe depender de clases concretas"],
  estructura: "FabricaUI (interfaz)\n ├─ crearBoton()   → Boton\n └─ crearCheckbox() → Checkbox\nFabricaClara  → BotonClaro,  CheckboxClaro\nFabricaOscura → BotonOscuro, CheckboxOscuro\nAplicacion usa solo FabricaUI",
  enJava: ["DocumentBuilderFactory", "javax.xml.transform.TransformerFactory", "Drivers de WebDriver por navegador"],
  ojo: "Añadir una familia nueva es fácil; añadir un producto nuevo (p. ej. crearSlider) obliga a tocar todas las fábricas. Factory Method crea UN producto; Abstract Factory crea FAMILIAS de productos relacionados.",
  ejercicios: [
    { id: "abstract-factory", titulo: "Temas claro y oscuro", tipo: "programa",
      tarea: "Crea la familia oscura completa: BotonOscuro, CheckboxOscuro y haz que FabricaOscura los devuelva.",
      pistas: ["class BotonOscuro implements Boton { public String pintar() { return \"Botón negro con texto blanco\"; } }", "Igual para CheckboxOscuro con \"Checkbox con borde azul\".", "En FabricaOscura sustituye el throw por return new BotonOscuro(); y return new CheckboxOscuro();"] },
    { id: "abstract-factory-muebles", titulo: "Muebles", tipo: "pruebas",
      tarea: "Completa las fábricas de muebles moderno y victoriano y el Comedor, que amuebla usando solo la fábrica que recibe.",
      pasos: ["FabricaModerna devuelve SillaModerna y MesaModerna; FabricaVictoriana, SillaVictoriana y MesaVictoriana.", "Cada llamada a crearX() devuelve un objeto nuevo.", "Comedor guarda la fábrica recibida en su constructor.", "amueblar(): pide una mesa y una silla a la fábrica y muestra Mesa: ... y luego Silla: ...", "Comedor no debe hacer new de ningún mueble concreto."],
      pistas: ["public Silla crearSilla() { return new SillaModerna(); }", "this.fabrica = fabrica;", "Mesa mesa = fabrica.crearMesa(); Silla silla = fabrica.crearSilla(); System.out.println(\"Mesa: \" + mesa.describir());"] }
  ] },

{ id: "factory-method", nombre: "Factory Method", cat: "crea",
  intencion: "Define un método para crear un objeto, pero deja que las subclases decidan qué clase concreta instanciar.",
  problema: "La lógica de 'planificar entrega' es la misma para todas las empresas, pero cada una usa un transporte distinto. No quieres un switch gigante con new Camion(), new Barco()...",
  analogia: "Una franquicia: el manual de cómo atender al cliente es el mismo, pero cada local decide qué producto local fabrica.",
  cuando: ["Una clase no sabe de antemano qué objetos debe crear", "Quieres que las subclases elijan el tipo concreto", "Quieres extender sin modificar el código existente (Open/Closed)"],
  estructura: "Logistica (abstracta)\n ├─ crearTransporte()  ← factory method (abstracto)\n └─ planificarEntrega() usa crearTransporte()\nLogisticaTerrestre → new Camion()\nLogisticaMaritima  → new Barco()",
  enJava: ["Collection.iterator()", "Calendar.getInstance()", "NumberFormat.getInstance()"],
  ojo: "Propósito (pregunta de examen): crear objetos sin especificar la clase exacta que se creará. Diferencia con Abstract Factory: Factory Method crea un único producto; Abstract Factory, familias.",
  ejercicios: [
    { id: "factory-method", titulo: "Logística", tipo: "programa",
      tarea: "Implementa Barco, Avion, LogisticaMaritima y LogisticaAerea, y añade la logística aérea a la lista de main.",
      pistas: ["class Barco implements Transporte { public String entregar() { return \"Barco entrega por mar en contenedor\"; } }", "class LogisticaAerea extends Logistica { protected Transporte crearTransporte() { return new Avion(); } }", "No olvides añadir la coma en List.of(..., new LogisticaAerea())."] },

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const store = {
  get(k, d) { try { const v = localStorage.getItem("patrones:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("patrones:" + k, JSON.stringify(v)); } catch {} }
};
let hechos = new Set(store.get("hechos", []));

/* ---------- Resaltado de sintaxis Java (un solo paso) ---------- */
const KW = "abstract|assert|boolean|break|byte|case|catch|char|class|const|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|native|new|package|private|protected|public|record|return|short|static|super|switch|synchronized|this|throw|throws|transient|try|var|void|volatile|while|true|false|null";
const RE = new RegExp(`(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:[^"\\\\\\n]|\\\\.)*"|'(?:[^'\\\\\\n]|\\\\.)*')|(@\\w+)|\\b(${KW})\\b|\\b(\\d[\\d_]*(?:\\.\\d+)?[LlFfDd]?)\\b|\\b([A-Z]\\w*)\\b`, "g");
function resaltar(src) {
  let out = "", i = 0, m;
  RE.lastIndex = 0;
  while ((m = RE.exec(src))) {
    out += esc(src.slice(i, m.index));
    const t = esc(m[0]);
    if (m[1]) out += `<span class="tk-c">${t.replace(/\bTODO\b[^\n]*/g, x => `<span class="tk-todo">${x}</span>`)}</span>`;
    else if (m[2]) out += `<span class="tk-s">${t}</span>`;
    else if (m[3]) out += `<span class="tk-a">${t}</span>`;
    else if (m[4]) out += `<span class="tk-k">${t}</span>`;
    else if (m[5]) out += `<span class="tk-n">${t}</span>`;
    else out += `<span class="tk-t">${t}</span>`;
    i = m.index + m[0].length;
  }
  return out + esc(src.slice(i)) + "\n";
}

function pintarLista() {
  const lista = $("#lista");
  let html = "";
  for (const cat of ["crea", "comp", "estr", "algo"]) {
    html += `<div class="grupo ${cat}">${CATS[cat]}</div>`;
    for (const p of PATRONES.filter(p => p.cat === cat)) {
      const n = p.ejercicios.filter(e => hechos.has(e.id)).length, t = p.ejercicios.length;
      const clase = n === t ? "hecho" : n > 0 ? "parcial" : "";
      html += `<button class="item ${clase}" data-id="${p.id}" aria-current="${actual === p.id}"><span class="check">✓</span>${p.corto || p.nombre}${t > 1 ? `<span class="cuenta">${n}/${t}</span>` : ""}</button>`;
    }
  }
  html += `<div class="grupo extra">Repaso</div>
    <button class="item" data-id="test" aria-current="${actual === "test"}"><span class="check" style="border-style:dashed"></span>Test teórico<span class="cuenta">${PREGUNTAS.length}</span></button>
    <button class="item" data-id="comparar" aria-current="${actual === "comparar"}"><span class="check" style="border-style:dashed"></span>Comparativas</button>`;
  lista.innerHTML = html;

  $("#txt-progreso").textContent = `${n} de ${TODOS_EJ.length} ejercicios superados`;
}

const leerPruebas = txt => txt.replace(/\r\n/g, "\n").split(/^### PRUEBA\n/m).filter(b => b.trim()).map(b => {
  const [c, e = ""] = b.split(/^### ESPERADO\n/m);
  return { codigo: c.trimEnd(), esperado: e.trimEnd() };
});

async function cargar(ej) {
  if (cache[ej.id]) return cache[ej.id];
  const extra = ej.tipo === "pruebas" ? "pruebas.txt" : "esperado.txt";
  const [inicio, solucion, otro] = await Promise.all(
    ["inicio.java", "solucion.java", extra].map(f => fetch(`ejercicios/${ej.id}/${f}`, { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(f); return r.text(); })));
  return cache[ej.id] = ej.tipo === "pruebas" ? { inicio, solucion, pruebas: leerPruebas(otro) } : { inicio, solucion, esperado: otro };
}

      <button class="btn" id="btn-reset">Reiniciar código</button>
      <button class="btn" id="btn-sol">Ver solución</button>
      <span class="atajo">Ctrl + Enter ${esPruebas ? "comprueba" : "ejecuta"} · Tab indenta</span>
    </div>
    <div class="lab">
      <div class="editor">
        <div class="gutter" id="gutter"></div>
        <div class="zona"><pre id="hl" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Editor de código Java"></textarea></div>
      </div>
      <div class="consola">
        <div class="con-cab"><b>Consola</b><span class="estado" id="estado">Listo</span></div>
        <div class="con-tabs" role="tablist" id="con-tabs"></div>
        <div class="con-cuerpo" id="con"></div>
        <div class="veredicto" id="veredicto" hidden></div>
      </div>
    </div>`;

  let pistasVistas = 0;
  $("#btn-pista").onclick = () => {
    const el = document.createElement("p");
    el.textContent = `Pista ${pistasVistas + 1}: ${ej.pistas[pistasVistas]}`;
    $("#pistas").appendChild(el);
    pistasVistas++;
    if (pistasVistas >= ej.pistas.length) $("#btn-pista").remove();
    else $("#btn-pista").textContent = `Otra pista (${ej.pistas.length - pistasVistas})`;
  };

  let datos;
  try { datos = await cargar(ej); }
  catch { $("#aviso").innerHTML = `<div class="aviso">No se pudieron cargar los ejercicios. Abre la página desde el servidor: ejecuta <code>java Servidor.java</code> en la carpeta del laboratorio y entra en <code>http://localhost:8765</code>.</div>`; return; }
  if (!$("#code") || store.get("ej:" + p.id) !== ej.id) return;

  const ta = $("#code");
  ta.value = store.get("code:" + ej.id, datos.inicio);
  const refrescar = () => {
    $("#hl").innerHTML = resaltar(ta.value);
    const n = ta.value.split("\n").length;
    $("#gutter").textContent = Array.from({ length: n }, (_, i) => i + 1).join("\n") + "\n";
    sincronizar();
  };
  const sincronizar = () => { $("#hl").scrollTop = ta.scrollTop; $("#hl").scrollLeft = ta.scrollLeft; $("#gutter").scrollTop = ta.scrollTop; };
  ["keyup", "click", "select"].forEach(ev => ta.addEventListener(ev, () => requestAnimationFrame(sincronizar)));
  let guardarT;
  ta.addEventListener("input", () => { refrescar(); clearTimeout(guardarT); guardarT = setTimeout(() => store.set("code:" + ej.id, ta.value), 300); });
  ta.addEventListener("scroll", sincronizar);
  ta.addEventListener("keydown", e => teclas(e, ta, ejecutar));
  refrescar();

  // Pestañas de la consola según el tipo de ejercicio
  const TABS = esPruebas ? [["resultado", "Resultado"], ["pruebas", `Pruebas (${datos.pruebas.length})`]]
                         : [["salida", "Salida"], ["esperada", "Salida esperada"], ["diff", "Comparación"]];
  $("#con-tabs").innerHTML = TABS.map(([k, t], i) => `<button role="tab" data-tab="${k}" aria-selected="${i === 0}">${t}</button>`).join("");
  const ultimo = { html: null, salida: null };
  const mostrarTab = t => {
    $("#con-tabs").querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    const con = $("#con");
    const vacio = `<span class="dim">Pulsa ${esPruebas ? "Comprobar" : "Ejecutar"} para compilar con javac y ver el resultado aquí.</span>`;
    if (t === "pruebas") con.innerHTML = listaPruebas(datos.pruebas);
    else if (t === "esperada") con.innerHTML = esc(datos.esperado);
    else if (t === "diff") con.innerHTML = ultimo.salida === null ? `<span class="dim">Ejecuta primero tu código.</span>` : diff(datos.esperado, ultimo.salida);
    else con.innerHTML = ultimo.html ?? vacio;
  };
  $("#con-tabs").querySelectorAll("button").forEach(b => b.onclick = () => mostrarTab(b.dataset.tab));
  mostrarTab(TABS[0][0]);

  const marcarHecho = () => { hechos.add(ej.id); store.set("hechos", [...hechos]); pintarLista(); pintarSelector(p, ej); };

  async function ejecutar() {
    const btn = $("#btn-run");
    btn.disabled = true;
    const est = $("#estado"), v = $("#veredicto");
    est.className = "estado"; est.textContent = "Compilando…";
    v.hidden = true;
    store.set("code:" + ej.id, ta.value);
    let r, armado;
    try {
      if (esPruebas) {
        armado = armarPruebas(ta.value, datos.pruebas);
        est.textContent = `Compilando y ejecutando ${datos.pruebas.length} pruebas…`;
        r = await (await fetch(`/api/test?n=${datos.pruebas.length}`, { method: "POST", headers: { "Content-Type": "text/plain; charset=utf-8" }, body: armado.src })).json();
      } else {
        r = await (await fetch("/api/run", { method: "POST", headers: { "Content-Type": "text/plain; charset=utf-8" }, body: ta.value })).json();
      }
    } catch {
      btn.disabled = false;
      est.className = "estado bad"; est.textContent = "Sin servidor";
      ultimo.html = `<span class="err">No hay conexión con el compilador (o el servidor es una versión antigua).\nCierra la ventana del servidor y vuelve a abrir iniciar.cmd.</span>`;
      mostrarTab(TABS[0][0]); return;
    }
    btn.disabled = false;
    if (!$("#code") || store.get("ej:" + p.id) !== ej.id) return;

    if (r.fase === "compilacion") {
      est.className = "estado bad"; est.textContent = "Error de compilación";
      const txt = esPruebas ? mapearLineas(r.salida || "", armado) : (r.salida || "").replace(/^.*Main\.java:/gm, "Línea ");
      ultimo.html = `<span class="err">${esc(txt)}</span>`;
      ultimo.salida = "";
      v.hidden = false; v.className = "veredicto bad"; v.textContent = "No compila. Revisa la línea indicada.";
      mostrarTab(TABS[0][0]); return;
    }

    if (esPruebas) {
      const res = datos.pruebas.map((pr, i) => {
        const x = r.resultados[i] || { salida: "", codigo: -1 };
        return { ...pr, obtenido: x.salida, codigo: x.codigo, ms: x.ms, timeout: x.timeout, ok: x.codigo === 0 && normal(x.salida) === normal(pr.esperado) };
      });
      const n = res.filter(x => x.ok).length;
      ultimo.html = res.map((x, i) => bloquePrueba(x, i)).join("");
      const todo = n === res.length;
      est.className = "estado " + (todo ? "ok" : "bad");
      est.textContent = `${n}/${res.length} pruebas`;
      v.hidden = false;
      v.className = "veredicto " + (todo ? "ok" : "bad");
      v.textContent = todo ? `✓ Todas las pruebas superadas (${n}/${res.length}).` : `${n} de ${res.length} pruebas superadas. Abre las marcadas con ✗ para ver la diferencia.`;
      if (todo) marcarHecho();
      mostrarTab("resultado");
      return;
    }

    const salida = r.salida || "";
    ultimo.salida = salida;
    if (r.timeout) {
      est.className = "estado warn"; est.textContent = "Tiempo agotado (10 s)";
      ultimo.html = esc(salida) + `\n<span class="err">El programa tardó más de 10 segundos y se detuvo. ¿Hay un bucle infinito?</span>`;
    } else {
      const errIdx = salida.search(/^Exception in thread/m);
      ultimo.html = errIdx >= 0 ? esc(salida.slice(0, errIdx)) + `<span class="err">${esc(salida.slice(errIdx))}</span>` : esc(salida);
      if (!salida) ultimo.html = `<span class="dim">(el programa no imprimió nada)</span>`;
      ultimo.html += `\n<span class="dim">— terminó con código ${r.codigo} en ${r.ms} ms —</span>`;
      const ok = r.codigo === 0 && normal(salida) === normal(datos.esperado);
      est.className = "estado " + (ok ? "ok" : r.codigo === 0 ? "warn" : "bad");
      est.textContent = ok ? "Correcto" : r.codigo === 0 ? "Salida distinta" : "Excepción";
      v.hidden = false;
      if (ok) { v.className = "veredicto ok"; v.textContent = "✓ Ejercicio superado: la salida coincide con la esperada."; marcarHecho(); }
      else {
        v.className = "veredicto bad";
        v.textContent = r.codigo !== 0 ? "El programa lanzó una excepción. Revisa los TODO pendientes." : `La salida no coincide (línea ${primeraDiferencia(datos.esperado, salida)}). Mira la pestaña Comparación.`;
      }
    }
    mostrarTab(r.codigo === 0 && normal(salida) !== normal(datos.esperado) ? "diff" : "salida");
  }

  $("#btn-run").onclick = ejecutar;
  $("#btn-reset").onclick = () => {
    const b = $("#btn-reset");
    if (b.dataset.confirm) { ta.value = datos.inicio; store.set("code:" + ej.id, ta.value); refrescar(); b.textContent = "Reiniciar código"; delete b.dataset.confirm; return; }
    b.dataset.confirm = "1"; b.textContent = "¿Seguro? Pulsa otra vez";
    setTimeout(() => { if (b.isConnected) { b.textContent = "Reiniciar código"; delete b.dataset.confirm; } }, 3000);
  };
  $("#btn-sol").onclick = () => {
    const b = $("#btn-sol");
    if (b.dataset.sol) { ta.value = b.dataset.prev; delete b.dataset.sol; b.textContent = "Ver solución"; }
    else { b.dataset.prev = ta.value; b.dataset.sol = "1"; ta.value = datos.solucion; b.textContent = "Volver a mi código"; }
    refrescar();
  };
}

/* ---------- Modo CodeRunner ---------- */
// Junta las clases del alumno + una clase Prueba<i> por cada prueba (cada una con su main).
// En un único Main.java solo puede haber una clase public, así que se quita "public" de las clases de nivel superior.
function armarPruebas(usuario, pruebas) {
  const u = usuario.replace(/^(\s*)public\s+((?:abstract\s+|final\s+)*)(class|interface|enum|record)\b/gm, "$1$2$3");
  let src = u + "\n\npublic class Main { public static void main(String[] args) { } }\n";
  const inicios = [];
  pruebas.forEach((pr, i) => {
    src += `\nclass Prueba${i + 1} { public static void main(String[] args) throws Exception {\n`;
    inicios.push(src.split("\n").length);
    src += pr.codigo + "\n} }\n";
  });
  return { src, lineasUsuario: usuario.split("\n").length, inicios };
}
function mapearLineas(txt, armado) {
  return txt.replace(/^.*Main\.java:(\d+):/gm, (_, n) => {
    n = +n;
    if (n <= armado.lineasUsuario) return `Línea ${n}:`;
    for (let k = armado.inicios.length - 1; k >= 0; k--) if (n >= armado.inicios[k]) return `Prueba ${k + 1}, línea ${n - armado.inicios[k] + 1}:`;
    return `Código de prueba:`;
  });
}
function bloquePrueba(x, i) {
  const estado = x.ok ? "ok" : "mal";
  const obt = x.timeout ? x.obtenido + "\n(tiempo agotado)" : x.obtenido;
  return `<details class="prueba ${estado}" ${x.ok ? "" : "open"}>
    <summary><span class="marca">${x.ok ? "✓" : "✗"}</span><b>Prueba ${i + 1}</b><span class="ms">${x.ms ?? ""} ms</span></summary>
    <div class="bloques">
      <div class="bloque"><b>Prueba</b><pre>${esc(x.codigo)}</pre></div>
      <div class="bloque"><b>Esperado</b><pre class="esp">${esc(x.esperado) || " "}</pre></div>
      <div class="bloque"><b>Obtenido</b><pre class="${x.ok ? "esp" : "obt-mal"}">${esc(obt.replace(/\s+$/, "")) || "(nada)"}</pre></div>
    </div></details>`;
}
function listaPruebas(pruebas) {
  return pruebas.map((x, i) => `<details class="prueba pend" open>
    <summary><span class="marca">•</span><b>Prueba ${i + 1}</b></summary>
    <div class="bloques">
      <div class="bloque"><b>Prueba</b><pre>${esc(x.codigo)}</pre></div>
      <div class="bloque"><b>Resultado esperado</b><pre class="esp">${esc(x.esperado) || " "}</pre></div>
    </div></details>`).join("");
}

/* ---------- Teclado del editor ---------- */
function teclas(e, ta, ejecutar) {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); ejecutar(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); return; }
  const { selectionStart: s, selectionEnd: f, value: v } = ta;
  const insertar = (txt, ini = s, fin = f) => { ta.setRangeText(txt, ini, fin, "end"); ta.dispatchEvent(new Event("input")); };
  if (e.key === "Tab") {
    e.preventDefault();
    const iniLinea = v.lastIndexOf("\n", s - 1) + 1;
    if (s !== f && v.slice(s, f).includes("\n") || e.shiftKey) {
      const bloque = v.slice(iniLinea, f);
      const nuevo = e.shiftKey ? bloque.replace(/^ {1,4}/gm, "") : bloque.replace(/^/gm, "    ");
      ta.setRangeText(nuevo, iniLinea, f, "select"); ta.dispatchEvent(new Event("input"));
    } else insertar("    ");
  } else if (e.key === "Enter") {
    e.preventDefault();
    const iniLinea = v.lastIndexOf("\n", s - 1) + 1;
    const linea = v.slice(iniLinea, s);
    let sangria = linea.match(/^\s*/)[0];
    if (/\{\s*$/.test(linea)) sangria += "    ";
    if (/^\s*\}/.test(v.slice(s)) && /\{\s*$/.test(linea)) { insertar("\n" + sangria + "\n" + sangria.slice(4)); ta.selectionStart = ta.selectionEnd = s + 1 + sangria.length; return; }
    insertar("\n" + sangria);
  } else if (e.key === "}") {
    const iniLinea = v.lastIndexOf("\n", s - 1) + 1;
    if (/^\s{4,}$/.test(v.slice(iniLinea, s))) { e.preventDefault(); insertar(v.slice(iniLinea, s - 4) + "}", iniLinea, f); }
  }
}

/* ---------- Comparación de salidas ---------- */
const normal = s => String(s).replace(/\r\n/g, "\n").split("\n").map(l => l.trimEnd()).join("\n").trim();
function primeraDiferencia(a, b) {
  const x = normal(a).split("\n"), y = normal(b).split("\n");
  for (let i = 0; i < Math.max(x.length, y.length); i++) if (x[i] !== y[i]) return i + 1;
  return 0;
}
function diff(esperado, obtenido) {
  const x = normal(esperado).split("\n"), y = normal(obtenido).split("\n");
  let html = `<span class="dim">✓ = línea correcta · ✗ = diferente (esperado / obtenido)</span>\n\n`;
  for (let i = 0; i < Math.max(x.length, y.length); i++) {
    if (x[i] === y[i]) html += `<div class="diff-l"><span class="okl">✓</span><span>${esc(x[i])}</span></div>`;
    else html += `<div class="diff-l mal"><span class="err">✗</span><span><span class="okl">${x[i] === undefined ? "(sin línea)" : esc(x[i])}</span>\n<span class="err">${y[i] === undefined ? "(falta esta línea)" : esc(y[i])}</span></span></div>`;
  }
  return html;
}

/* ---------- Test teórico ---------- */
function pintarTest() {
  const resp = store.get("test", {});
  const main = $("#main");
  const marcador = () => {
    const contestadas = Object.keys(resp).length;
    const bien = PREGUNTAS.filter((q, i) => resp[i] === q.c).length;
    return `<span class="marcador"><b>${bien}</b> correctas de ${contestadas} respondidas · ${PREGUNTAS.length} preguntas</span>`;
  };
  main.innerHTML = `
    <div class="cabecera"><h2>Test teórico</h2><span class="chip algo">Pre-evaluación UTEC</span></div>
    <p class="intencion">Las preguntas de opción múltiple de tu pre-evaluación, sin repetidas. Elige una respuesta para ver si es correcta y por qué.</p>
    <div class="quiz-cab"><span id="marcador">${marcador()}</span><button class="btn" id="btn-reiniciar-test">Empezar de nuevo</button></div>
    <div id="preguntas"></div>`;
  const cont = $("#preguntas");
  cont.innerHTML = PREGUNTAS.map((q, i) => `
    <div class="pregunta" id="preg-${i}">
      <div class="tema">${esc(q.tema)}</div>
      <h3><span class="num">${i + 1}.</span><span>${esc(q.p)}</span></h3>
      <div class="opciones">${q.o.map((op, j) => `<button data-i="${i}" data-j="${j}"><span class="letra">${"abcd"[j]}.</span><span>${esc(op)}</span></button>`).join("")}</div>
      <div class="explicacion" hidden></div>
    </div>`).join("");
  const pintarPregunta = i => {
    const q = PREGUNTAS[i], el = $(`#preg-${i}`), r = resp[i];
    el.querySelectorAll("button").forEach(b => {
      const j = +b.dataset.j;
      b.disabled = r !== undefined;
      b.classList.toggle("correcta", r !== undefined && j === q.c);
      b.classList.toggle("incorrecta", r !== undefined && j === r && r !== q.c);
    });
    const ex = el.querySelector(".explicacion");
    ex.hidden = r === undefined;
    if (r !== undefined) ex.textContent = (r === q.c ? "✓ Correcto. " : `✗ La respuesta correcta es la ${"abcd"[q.c]}. `) + q.e;
  };
  cont.querySelectorAll(".opciones button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    resp[i] = +b.dataset.j; store.set("test", resp);
    pintarPregunta(i); $("#marcador").innerHTML = marcador();
  });
  PREGUNTAS.forEach((_, i) => pintarPregunta(i));
  $("#btn-reiniciar-test").onclick = () => { for (const k in resp) delete resp[k]; store.set("test", resp); pintarTest(); };
}

function pintarComparativas() {

      <tr><td><b>Decorator</b></td><td>No, la mantiene</td><td>Añadir comportamiento por capas</td><td>¿Quiero sumar extras combinables?</td></tr>

      <tr><td><b>Facade</b></td><td>Crea una nueva, más simple</td><td>Ocultar varios subsistemas</td><td>¿Hay demasiadas piezas que coordinar?</td></tr>
    </table></div>
    <h3>Tipos de Proxy</h3>
    <div class="scroll-x"><table class="comp">
      <tr><th>Tipo</th><th>Qué hace</th><th>Ejercicio</th></tr>
      <tr><td><b>Virtual</b></td><td>Retrasa la creación del objeto costoso hasta que se necesita</td><td>Galería · Documentos por rol</td></tr>
      <tr><td><b>Protección</b></td><td>Comprueba permisos antes de delegar</td><td>Permiso sí/no · Documentos por rol</td></tr>
      <tr><td><b>Remoto</b></td><td>Representa un objeto que vive en otra máquina</td><td>—</td></tr>
      <tr><td><b>Registro</b></td><td>Anota cada llamada antes de delegar</td><td>—</td></tr>
    </table></div>
    <h3>Patrones de creación</h3>
    <div class="scroll-x"><table class="comp">
      <tr><th>Patrón</th><th>Crea…</th><th>Cómo</th><th>Pista para reconocerlo</th></tr>

      <tr><td><b>Factory Method</b></td><td>Un producto</td><td>Una subclase sobrescribe el método creador</td><td>Método abstracto crearX() + herencia</td></tr>
      <tr><td><b>Abstract Factory</b></td><td>Una familia de productos</td><td>Un objeto fábrica con varios crearX()</td><td>Varias fábricas intercambiables</td></tr>
      <tr><td><b>Prototype</b></td><td>Copias</td><td>Clonando un objeto existente</td><td>Método clonar() o constructor de copia</td></tr>
      <tr><td><b>Singleton</b></td><td>Una sola instancia</td><td>Constructor privado + acceso estático</td><td>getInstancia()</td></tr>
    </table></div>
    <h3>Comportamiento</h3>
    <div class="scroll-x"><table class="comp">
      <tr><th>Patrón</th><th>Relación</th><th>Quién decide</th><th>Ejemplo típico</th></tr>
      <tr><td><b>Observer</b></td><td>Uno a muchos, por eventos</td><td>El sujeto avisa cuando cambia</td><td>Listeners, notificaciones, eventos de UI</td></tr>
      <tr><td><b>Strategy</b></td><td>Uno a uno, intercambiable</td><td>El cliente elige el algoritmo</td><td>Comparator, métodos de pago, descuentos</td></tr>
    </table></div>
    <h3>Estructuras de datos</h3>

pintarLista();
const inicial = (location.hash || "").slice(1);
abrir(PATRONES.some(p => p.id === inicial) || inicial === "comparar" || inicial === "test" ? inicial : "builder");
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h && h !== actual) abrir(h); });
</script>
